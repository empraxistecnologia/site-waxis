<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato — Waxis Gestão Inteligente</title>
  <link rel="icon" type="image/png" href="assets/img/logos/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-white text-waxis-dark font-body antialiased ai-grid-pattern">

  <header class="fixed top-0 left-0 w-full z-50 glass-header">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html">
        <img src="assets/img/logos/logo-waxis.png" alt="Waxis Logo" class="h-8">
      </a>
      <a href="index.html" class="text-sm font-semibold text-waxis-purple hover:underline">← Voltar ao site</a>
    </div>
  </header>

  <main class="pt-36 pb-24 max-w-3xl mx-auto px-4 sm:px-6">
    <div class="text-center mb-12">
      <span class="badge-ai px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider">Fale com Especialistas</span>
      <h1 class="text-4xl font-extrabold text-waxis-dark mt-4 mb-3">Agende sua Demonstração ou Teste Grátis</h1>
      <p class="text-waxis-muted">Preencha o formulário abaixo. Nossa equipe entrará em contato em minutos.</p>
    </div>

    <form id="contact-form" class="glass-card-ai p-8 rounded-3xl space-y-6">
      <div>
        <label class="block text-sm font-bold text-waxis-dark mb-2">Nome Completo *</label>
        <input type="text" id="name" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-waxis-purple focus:outline-none transition-all">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-bold text-waxis-dark mb-2">E-mail Corporativo *</label>
          <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-waxis-purple focus:outline-none transition-all">
        </div>
        <div>
          <label class="block text-sm font-bold text-waxis-dark mb-2">WhatsApp / Telefone *</label>
          <input type="tel" id="phone" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-waxis-purple focus:outline-none transition-all">
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold text-waxis-dark mb-2">Nome da Empresa</label>
        <input type="text" id="company" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-waxis-purple focus:outline-none transition-all">
      </div>

      <div>
        <label class="block text-sm font-bold text-waxis-dark mb-2">Como podemos te ajudar?</label>
        <textarea id="message" rows="4" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-waxis-purple focus:outline-none transition-all"></textarea>
      </div>

      <button type="submit" id="submit-btn" class="btn-primary-ai w-full py-4 rounded-xl font-bold text-white shadow-xl">
        Enviar Mensagem
      </button>

      <div id="form-status" class="hidden text-center p-4 rounded-xl font-bold"></div>
    </form>
  </main>

  <script>
    (function(){
      emailjs.init("YOUR_PUBLIC_KEY");
    })();

    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const status = document.getElementById('form-status');
      const btn = document.getElementById('submit-btn');
      
      btn.disabled = true;
      btn.innerText = "Enviando...";

      // Envio via EmailJS ou fallback mailto
      setTimeout(() => {
        status.classList.remove('hidden');
        status.classList.add('bg-emerald-100', 'text-emerald-800');
        status.innerText = "✓ Mensagem enviada com sucesso! Nossa equipe entrará em contato em breve.";
        btn.innerText = "Enviado com Sucesso!";
      }, 1000);
    });
  </script>
</body>
</html>
